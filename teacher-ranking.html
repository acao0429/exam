<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本班答對題數排名 - 國語月考複習樂園</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home" data-role="teacher">
  <div class="topbar">
    <div class="topbar-inner">
      <a class="topbar-login" href="admin.html">← 返回題庫管理</a>
      <span class="topbar-title">🏆 本班答對題數排名</span>
      <span></span>
    </div>
  </div>

  <main class="screen screen-wide">
    <div class="panel" style="max-width:440px; margin:0 auto">
      <h2>🏆 本班答對題數排名</h2>
      <p class="hint">只顯示老師自己班級的學生，依答對題數由多到少排序。</p>
      <table class="word-table" style="margin-top:12px">
        <thead>
          <tr><th>排名</th><th>座號</th><th>答對數</th><th>總題數</th></tr>
        </thead>
        <tbody id="ranking-tbody">
          <tr><td colspan="4" style="text-align:center">載入中…</td></tr>
        </tbody>
      </table>
      <div class="center" style="margin-top:12px">
        <button class="btn btn-blue btn-sm" id="ranking-refresh">🔄 重新整理</button>
      </div>
      <p class="hint center" id="ranking-msg" style="margin-top:8px"></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/page-ranking.js"></script>
</body>
</html>
