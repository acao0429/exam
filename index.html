<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國語月考複習樂園</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home">
  <div class="topbar">
    <div class="topbar-inner">
      <span class="topbar-title">🦉 國語月考複習樂園</span>
      <div class="topbar-buttons">
        <span id="student-welcome-text" style="display:none; font-weight:bold; margin-right:8px"></span>
        <button class="topbar-login" id="top-ranking-btn" style="display:none">🏆 排名</button>
        <button class="topbar-login" id="change-student-password-btn" style="display:none">🔑 修改密碼</button>
        <button class="topbar-login" id="student-logout-btn" style="display:none">🚪 登出</button>
      </div>
    </div>
  </div>

  <!-- 排名彈窗 -->
  <div class="login-pop hidden" id="ranking-pop">
    <div class="panel" style="max-width:400px">
      <h2>🏆 答對題數排名</h2>
      <table class="word-table" style="margin-top:12px">
        <thead>
          <tr><th>排名</th><th>座號</th><th>答對數</th><th>總題數</th></tr>
        </thead>
        <tbody id="ranking-tbody"></tbody>
      </table>
      <div class="center" style="margin-top:12px">
        <button class="btn btn-gray btn-sm" id="ranking-close">關閉</button>
        <button class="btn btn-blue btn-sm" id="ranking-refresh">重新整理</button>
      </div>
      <p class="hint" id="ranking-msg" style="margin-top:8px"></p>
    </div>
  </div>

  <!-- 修改密碼彈窗 -->
  <div class="login-pop hidden" id="change-pwd-pop">
    <div class="panel" style="max-width:360px">
      <h2>🔑 修改密碼</h2>
      <div class="form-row"><label>舊密碼</label><input type="password" id="old-password"></div>
      <div class="form-row"><label>新密碼</label><input type="password" id="new-password"></div>
      <div class="form-row"><label>確認新密碼</label><input type="password" id="confirm-password"></div>
      <div class="center">
        <button class="btn btn-blue" id="submit-change-btn">確認修改</button>
        <button class="btn btn-gray btn-sm" id="cancel-change-btn">取消</button>
      </div>
      <p class="hint" id="change-pwd-msg" style="margin-top:8px"></p>
    </div>
  </div>

  <header class="hero">
    <div class="hero-mascot">🦉</div>
    <h1>國語月考複習樂園</h1>
    <p>每天練一點，考試好簡單！</p>
  </header>

  <main class="home-cards">
    <a class="card" href="zhuyin.html">
      <div class="card-icon">🔤</div>
      <h2>國字注音</h2>
      <p>看字選音、看音選字，還有語詞意義測驗，把生字全都記牢牢。</p>
      <span class="card-btn">開始練習</span>
    </a>

    <a class="card" href="content.html">
      <div class="card-icon">📖</div>
      <h2>文意內容</h2>
      <p>理解課文與句子意思，讀懂文章不頭痛。</p>
      <span class="card-btn">開始練習</span>
    </a>

    <a class="card" href="idiom.html">
      <div class="card-icon">🎯</div>
      <h2>成語練習</h2>
      <p>成語猜一猜，用對成語一把罩。</p>
      <span class="card-btn">開始練習</span>
    </a>
  </main>

  <footer class="credit">給老師：請先到 <a href="login.html" style="color:inherit">登入頁</a> 以老師帳號登入。</footer>

  <script src="js/config.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
