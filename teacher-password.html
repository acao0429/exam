<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密碼 - 國語月考複習樂園</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home" data-role="teacher">
  <div class="topbar">
    <div class="topbar-inner">
      <a class="topbar-login" href="admin.html">← 返回題庫管理</a>
      <span class="topbar-title">🔑 修改密碼</span>
      <span></span>
    </div>
  </div>

  <main class="screen screen-wide">
    <div class="panel" style="max-width:380px; margin:0 auto">
      <h2>🔑 修改密碼</h2>
      <p class="hint">修改成功後需要重新登入。</p>
      <div class="form-row" style="margin-top:14px">
        <label>舊密碼</label>
        <input type="password" id="old-password" autocomplete="current-password">
      </div>
      <div class="form-row">
        <label>新密碼</label>
        <input type="password" id="new-password" autocomplete="new-password">
      </div>
      <div class="form-row">
        <label>確認新密碼</label>
        <input type="password" id="confirm-password" autocomplete="new-password">
      </div>
      <div class="center">
        <button class="btn btn-blue" id="submit-change-btn">確認修改</button>
      </div>
      <p class="hint center" id="change-pwd-msg" style="margin-top:10px"></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/page-password.js"></script>
</body>
</html>
